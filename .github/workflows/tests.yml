name: Python, RTL and synthesis checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install RTL and synthesis tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes iverilog yosys
      - name: Python reference tests
        run: python -m unittest discover -s tests -v
      - name: RTL integration simulation
        run: make test-rtl
      - name: Generic synthesis smoke test
        run: make test-synth
